[project]
name = "relweave"
version = "0.1.1"
description = "Text of any length plus a schema to a typed knowledge graph"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "typer>=0.12",
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "xgrammar>=0.1.19",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
# training the generator (QLoRA through Unsloth and TRL) and the pair head
train = [
    "trl>=0.11",
    "datasets>=2.20",
    "unsloth",
]

[project.scripts]
relweave = "relweave.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
